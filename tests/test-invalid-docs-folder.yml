name: Test invalid docs folder fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: sphinx-build
        name: Build Sphinx docs with non-existent folder
        uses: .
        continue-on-error: true
        with:
          docs-folder: ${{ github.workspace }}/tests/fixtures/does-not-exist/

      - name: Assert build failed for invalid docs folder
        env:
          OUTCOME: ${{ steps.sphinx-build.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for non-existent docs folder"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for non-existent docs folder"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
