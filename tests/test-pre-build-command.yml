name: Test pre-build command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Sphinx build action with pre-build-command
        id: action
        uses: .
        with:
          docs-folder: tests/fixtures/docs/
          build-command: sphinx-build -b html . _build/html
          pre-build-command: echo "Pre-build step running" && pip install sphinx-rtd-theme
      - name: Assert build output exists
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/tests/fixtures/docs/_build/html" ]; then
            echo "FAIL: expected _build/html directory not found"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/tests/fixtures/docs/_build/html/index.html" ]; then
            echo "FAIL: expected index.html not found in build output"
            exit 1
          fi
          echo "PASS: Sphinx build with pre-build-command succeeded and index.html exists"
