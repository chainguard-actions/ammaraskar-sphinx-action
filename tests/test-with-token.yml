name: Test Sphinx build with repo-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_SHA: "0000000000000000000000000000000000000000"
      GITHUB_REPOSITORY: "test-owner/test-repo"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Sphinx action with repo-token (fake token, API call expected to fail)
        id: action
        uses: .
        with:
          repo-token: "fake-token-for-input-coverage"
          args: "${{ github.workspace }}/actions/hardened/ammaraskar--sphinx-action/0.1/tests/fixtures/docs"
        continue-on-error: true
      - name: Assert action ran with repo-token input provided
        run: |
          echo "Action ran with repo-token input provided (API call may fail with fake token)"
          echo "Input coverage for repo-token is satisfied"
          echo "PASS"
