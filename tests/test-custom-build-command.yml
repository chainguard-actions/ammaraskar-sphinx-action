name: Test custom build command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Show workspace contents
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/docs/"
      - name: Run sphinx-action with custom sphinx-build command
        id: action
        uses: .
        with:
          docs-folder: "tests/fixtures/docs/"
          build-command: "sphinx-build -b html . _build/html"
      - name: Assert build succeeded with custom command
        run: |
          echo "Checking that the HTML output was generated via custom build command..."
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/docs/" || true
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/docs/_build/" || true
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/docs/_build/html/" || true
          if [ ! -d "$GITHUB_WORKSPACE/tests/fixtures/docs/_build/html" ]; then
            echo "FAIL: expected _build/html directory not found"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/tests/fixtures/docs/_build/html/index.html" ]; then
            echo "FAIL: expected index.html not found in _build/html"
            ls -la "$GITHUB_WORKSPACE/tests/fixtures/docs/_build/html/" || true
            exit 1
          fi
          echo "PASS: Sphinx build with custom command succeeded and index.html was generated"
