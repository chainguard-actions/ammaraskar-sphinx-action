name: Test basic Sphinx build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: sphinx-build
        name: Build Sphinx docs
        uses: .
        with:
          docs-folder: ${{ github.workspace }}/tests/fixtures/docs-basic/

      - name: Assert build succeeded
        run: |
          echo "Sphinx build step completed successfully"
          BUILD_DIR="${GITHUB_WORKSPACE}/tests/fixtures/docs-basic/_build"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "FAIL: _build directory was not created by Sphinx"
            ls -la "${GITHUB_WORKSPACE}/tests/fixtures/docs-basic/" || true
            exit 1
          fi
          if [ ! -f "$BUILD_DIR/html/index.html" ]; then
            echo "FAIL: index.html was not generated"
            find "$BUILD_DIR" -type f || true
            exit 1
          fi
          echo "PASS: Sphinx HTML output found"
