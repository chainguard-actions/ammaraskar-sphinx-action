name: Test basic Sphinx build (no token)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_SHA: "0000000000000000000000000000000000000000"
      GITHUB_REPOSITORY: "test-owner/test-repo"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Sphinx action without repo-token
        id: action
        uses: .
        with:
          args: "${{ github.workspace }}/actions/hardened/ammaraskar--sphinx-action/0.1/tests/fixtures/docs"
      - name: Assert build succeeded
        run: |
          echo "Sphinx build completed successfully without repo-token"
          echo "PASS"
